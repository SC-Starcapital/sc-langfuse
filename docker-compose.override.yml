# Local podman deployment: wires the custom secrets and auth settings from .env
# into the containers, which docker-compose.yml does not pass through on its own.
x-secrets: &secrets
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  langfuse-worker:
    # Built from feat/google-signin-invite-only (podman build -f worker/Dockerfile .)
    image: localhost/sc-langfuse-worker:invite-only
    pull_policy: never
    environment: *secrets
  langfuse-web:
    # Built from master (podman build -f web/Dockerfile -t localhost/sc-langfuse-web:master .)
    image: localhost/sc-langfuse-web:master
    pull_policy: never
    environment:
      <<: *secrets
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_ALLOW_ACCOUNT_LINKING: ${AUTH_GOOGLE_ALLOW_ACCOUNT_LINKING:-}
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-}
      LANGFUSE_INIT_INSTANCE_OWNER_EMAIL: ${LANGFUSE_INIT_INSTANCE_OWNER_EMAIL:-}
      AUTH_DISABLE_USERNAME_PASSWORD: ${AUTH_DISABLE_USERNAME_PASSWORD:-}
      # Browser-facing MinIO URL for media links. Web only: the worker keeps
      # the in-network http://minio:9000 default.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT}
